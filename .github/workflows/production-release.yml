name: Production release

on:
  push:
    branches:
      - main
  workflow_dispatch:

concurrency:
  group: production-release
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  release:
    name: Production release
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    timeout-minutes: 20
    env:
      DATABASE_DIRECT_URL: ${{ secrets.DATABASE_DIRECT_URL }}
      TRIGGER_ACCESS_TOKEN: ${{ secrets.TRIGGER_ACCESS_TOKEN }}
      TRIGGER_PROJECT_REF: ${{ vars.TRIGGER_PROJECT_REF }}
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: 1.3.9

      - name: Verify production configuration
        run: |
          test -n "$DATABASE_DIRECT_URL" || { echo "DATABASE_DIRECT_URL is not configured." >&2; exit 1; }
          test -n "$TRIGGER_ACCESS_TOKEN" || { echo "TRIGGER_ACCESS_TOKEN is not configured." >&2; exit 1; }
          test -n "$TRIGGER_PROJECT_REF" || { echo "TRIGGER_PROJECT_REF is not configured." >&2; exit 1; }

      - name: Install dependencies
        run: bun install --frozen-lockfile

      - name: Apply database migrations
        env:
          VERCEL_ENV: production
        run: bun run --cwd apps/web db:migrate:deploy

      - name: Deploy background tasks
        run: bun run --cwd apps/web trigger:deploy --external-id "$GITHUB_SHA"
