services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_USER: agentprint
      POSTGRES_PASSWORD: agentprint
      POSTGRES_DB: agentprint
    ports:
      - "54329:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U agentprint"]
      interval: 2s
      timeout: 3s
      retries: 20
    volumes:
      - agentprint-postgres:/var/lib/postgresql/data

volumes:
  agentprint-postgres:
